<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
<title>TimecodeMaster system overview</title>
<rect width="960" height="540" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#374151"/></marker></defs>
<rect x="15" y="20" width="535" height="500" rx="6" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="25" y="36" font-weight="600" fill="#374151">Master unit (one PCB)</text>
<rect x="40" y="60" width="200" height="140" rx="4" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
<text x="140.0" y="82" text-anchor="middle" font-weight="600" fill="#111827">LTC device (ESP32)</text>
<text x="140.0" y="102" text-anchor="middle" font-size="12" fill="#111827">Generates LTC frames</text>
<text x="140.0" y="119" text-anchor="middle" font-size="12" fill="#111827">Samples the clock interrupt</text>
<text x="140.0" y="136" text-anchor="middle" font-size="12" fill="#111827">Jam-sync decoder</text>
<text x="140.0" y="153" text-anchor="middle" font-size="12" fill="#111827">OLED, battery, buttons</text>
<rect x="300" y="60" width="190" height="140" rx="4" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
<text x="395.0" y="82" text-anchor="middle" font-weight="600" fill="#111827">Utility device (ESP32)</text>
<text x="395.0" y="102" text-anchor="middle" font-size="12" fill="#111827">Wi-Fi access point, web UI</text>
<text x="395.0" y="119" text-anchor="middle" font-size="12" fill="#111827">ESP-NOW transmitter</text>
<text x="395.0" y="136" text-anchor="middle" font-size="12" fill="#111827">Si5351 and RTC control</text>
<text x="395.0" y="153" text-anchor="middle" font-size="12" fill="#111827">SPI master</text>
<path d="M240 130 L300 130" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="270" y="122" text-anchor="middle" font-size="11" fill="#374151" font-weight="normal">SPI</text>
<rect x="300" y="250" width="190" height="60" rx="4" fill="#fff7ed" stroke="#9a3412" stroke-width="1.5"/>
<text x="395.0" y="272" text-anchor="middle" font-weight="600" fill="#111827">Si5351</text>
<text x="395.0" y="292" text-anchor="middle" font-size="12" fill="#111827">PLL 768 MHz, divider 1000 / 1001</text>
<rect x="300" y="340" width="190" height="50" rx="4" fill="#fff7ed" stroke="#9a3412" stroke-width="1.5"/>
<text x="395.0" y="362" text-anchor="middle" font-weight="600" fill="#111827">TCXO</text>
<text x="395.0" y="382" text-anchor="middle" font-size="12" fill="#111827">25 MHz, 0.5 ppm</text>
<rect x="300" y="420" width="190" height="60" rx="4" fill="#fff7ed" stroke="#9a3412" stroke-width="1.5"/>
<text x="395.0" y="442" text-anchor="middle" font-weight="600" fill="#111827">DS3231M RTC</text>
<text x="395.0" y="462" text-anchor="middle" font-size="12" fill="#111827">Date source for user bits</text>
<path d="M395 340 L395 310" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M490 150 L515 150 L515 280 L490 280" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M515 280 L515 450 L490 450" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
<text x="526" y="215" text-anchor="start" font-size="11" fill="#374151" font-weight="normal">I2C</text>
<path d="M300 280 L210 280 L210 200" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
<text x="256" y="256" text-anchor="middle" font-size="11" fill="#374151" font-weight="normal">CLK0 to GPIO34</text>
<text x="256" y="271" text-anchor="middle" font-size="11" fill="#374151" font-weight="normal">48000 / 47952 Hz</text>
<rect x="40" y="330" width="200" height="60" rx="4" fill="#fff7ed" stroke="#9a3412" stroke-width="1.5"/>
<text x="140.0" y="352" text-anchor="middle" font-weight="600" fill="#111827">Output stage</text>
<text x="140.0" y="372" text-anchor="middle" font-size="12" fill="#111827">Buffer, LINE/MIC attenuator</text>
<path d="M90 200 L90 330" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
<text x="98" y="265" text-anchor="start" font-size="11" fill="#374151" font-weight="normal">DAC, GPIO25</text>
<rect x="40" y="430" width="200" height="50" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="140.0" y="452" text-anchor="middle" font-weight="600" fill="#111827">LTC I/O jack</text>
<text x="140.0" y="472" text-anchor="middle" font-size="12" fill="#111827">3.5 mm, output and input</text>
<path d="M140 390 L140 430" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<rect x="620" y="40" width="240" height="70" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="740.0" y="62" text-anchor="middle" font-weight="600" fill="#111827">Browser (phone / laptop)</text>
<text x="740.0" y="82" text-anchor="middle" font-size="12" fill="#111827">192.168.4.1</text>
<path d="M490 85 L620 85" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="555" y="72" text-anchor="middle" font-size="11" fill="#374151" font-weight="normal">Wi-Fi AP</text>
<rect x="600" y="160" width="340" height="190" rx="6" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="610" y="176" font-weight="600" fill="#374151">Client units, up to 10</text>
<rect x="620" y="190" width="140" height="130" rx="4" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
<text x="690.0" y="212" text-anchor="middle" font-weight="600" fill="#111827">Client 1</text>
<text x="690.0" y="232" text-anchor="middle" font-size="12" fill="#111827">own Si5351 + TCXO</text>
<text x="690.0" y="249" text-anchor="middle" font-size="12" fill="#111827">own LTC output</text>
<rect x="780" y="190" width="140" height="130" rx="4" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
<text x="850.0" y="212" text-anchor="middle" font-weight="600" fill="#111827">Client n</text>
<text x="850.0" y="232" text-anchor="middle" font-size="12" fill="#111827">own Si5351 + TCXO</text>
<text x="850.0" y="249" text-anchor="middle" font-size="12" fill="#111827">own LTC output</text>
<path d="M490 165 L600 205" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="560" y="170" text-anchor="middle" font-size="11" fill="#374151" font-weight="normal">ESP-NOW</text>
<rect x="600" y="400" width="340" height="70" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="770.0" y="422" text-anchor="middle" font-weight="600" fill="#111827">Desktop tools (offline)</text>
<text x="770.0" y="442" text-anchor="middle" font-size="12" fill="#111827">LTC Sync App and LTC Analyzer read recorded audio</text>
</svg>